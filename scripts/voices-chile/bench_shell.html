<style>
:root{--bg:#131416;--card:#181a1e;--line:#292d34;--muted:#9aa1ad;--green:#225c4f}body{background:var(--bg);color:#ededeb;font-family:'Public Sans',system-ui,sans-serif}button{border-radius:8px;background:#25292f;border:1px solid var(--line);color:inherit;padding:10px 16px;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #98d2c1;outline-offset:3px}button:disabled{opacity:.4;cursor:default}.bench-header{border-bottom:1px solid var(--line);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.bench-header strong{font-weight:500;font-size:22px}.bench-header small{color:var(--muted);letter-spacing:3px;margin-left:8px}.bench-header nav{display:flex;gap:8px;flex-wrap:wrap}.bench-header button[aria-current=page]{background:var(--green)}body>h1{font-size:25px;font-weight:500}.card{border-radius:16px;padding:32px;box-shadow:0 16px 50px #0002}.quote{font-family:Georgia,serif;font-size:27px;line-height:1.6}.sample{background:#20232880;padding:20px;border-radius:12px}.sample h3{font-size:13px;letter-spacing:1px;text-transform:uppercase;font-weight:500}.scores{gap:16px}.scores label{font-size:13px;color:var(--muted)}.choices{background:#25292f;border-radius:8px;padding:3px}.choices button{border:0}.choices button[aria-pressed=true]{background:#225c4f;color:#e9f3ef}textarea{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;min-height:52px}.bench-panel{max-width:960px;margin:40px auto;padding:0 24px}.bench-panel h1{font-weight:500}.bench-panel p{color:var(--muted);line-height:1.7}.voice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.voice-tile{background:var(--card);border:1px solid var(--line);padding:22px;border-radius:14px}.voice-tile h2{font-size:20px}.bench-table{border-collapse:collapse;width:100%;font-size:14px}.bench-table th,.bench-table td{text-align:left;padding:14px 8px;border-bottom:1px solid var(--line)}.bench-table-wrap{overflow:auto}.bench-tools{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.bench-panel[hidden],[data-bench-hidden]{display:none!important}@media(max-width:700px){.card{padding:18px}.quote{font-size:23px}.bench-header{padding:16px}.bench-header nav{width:100%}}

/* Compact review: keep the task above the fold, details on demand. */
body>.bench-header{padding:10px 16px;gap:10px;flex-wrap:nowrap}.bench-header strong{font-size:18px}.bench-header small{font-size:10px;letter-spacing:1px}.bench-header nav{width:auto;gap:4px;flex-wrap:nowrap}.bench-header button{padding:7px 10px;font-size:12px;white-space:nowrap}#bench-pause{display:none}body>h1,body>p:not(#progress):not(#message):not(.bench-comparison),body>.export-actions{display:none}body>#voices{margin:12px auto 4px;gap:5px;padding:0 16px}#voices button{padding:6px 12px}body>#progress{margin:4px auto 8px;font-size:11px;padding:0 16px}body>#refdetail{margin:6px auto;padding:0 16px;font-size:12px}body>#control{margin:12px auto;padding:0 16px;font-size:12px}main#cards{max-width:960px;margin:0 auto;padding:0 16px}.card{padding:16px;border-radius:10px;box-shadow:none}.card h2{font-size:12px;font-weight:400;margin:0 0 8px;color:var(--muted)}.card>.small{display:none}.quote{font-family:inherit;font-size:18px;line-height:1.5;margin:0 0 16px}.grid{gap:12px;grid-template-columns:1fr 1fr}.sample{padding:12px;border-radius:8px;min-width:0}.sample h3{margin:0 0 8px;font-size:12px}.sample audio{height:34px;width:100%;margin:0}.sample>p{font-size:10px;margin:4px 0}.sample>label{font-size:11px;margin:6px 0;display:block}.scores{gap:8px;margin-top:12px}.scores label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}.scores .choices{display:flex;gap:0;margin:0;padding:2px}.choices button{padding:5px 8px;min-width:27px;font-size:12px}.sample details{font-size:11px;margin-top:10px;color:var(--muted)}.sample textarea{box-sizing:border-box;width:100%;min-height:40px;font-size:12px}#minimal-nav{margin:10px auto!important;padding:0 16px!important;gap:6px!important}#minimal-nav button{padding:8px 12px;font-size:12px}#minimal-nav span{font-size:11px}body>#message{margin:8px auto;font-size:12px}.bench-panel{margin:20px auto;padding:0 16px}.bench-panel h1{font-size:20px;margin:0 0 8px}.bench-panel>p{font-size:13px;margin:0 0 14px}.voice-grid{grid-template-columns:1fr;gap:0;border-top:1px solid var(--line)}.voice-tile{display:grid;grid-template-columns:35px 1fr 60px 80px;align-items:center;gap:12px;padding:12px 0;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0}.voice-tile h2,.voice-tile p{margin:0;font-size:13px;line-height:1.4}.voice-tile button{padding:7px 10px;font-size:12px}.bench-table th,.bench-table td{padding:9px 8px}.bench-panel>button{margin:12px 6px 0 0;padding:8px 12px;font-size:12px}@media(max-width:520px){.bench-header>div{display:none}.bench-header nav{width:100%;justify-content:space-between}.grid{grid-template-columns:1fr}.quote{font-size:16px}.voice-tile{grid-template-columns:30px 1fr 45px 65px;gap:8px}.voice-tile p{font-size:12px}#minimal-nav{flex-wrap:wrap}.scores label{font-size:13px}.choices button{padding:7px 10px}}

/* Larger readable controls and full use of available review width. */
body>.bench-comparison,body>#voices,body>#progress,body>#refdetail,body>#control,body>#message,main#cards,#minimal-nav,.bench-panel{max-width:1440px!important;width:calc(100% - 32px);box-sizing:border-box}main#cards{padding:0}.quote{font-size:21px}.scores label{font-size:15px;margin:0;line-height:1.4}.scores .choices{flex:0 0 58%;justify-content:space-between}.choices button{flex:1;min-width:32px;font-size:15px;padding:9px 6px}.sample h3{font-size:15px}.sample>label{font-size:13px}.sample details{font-size:13px}.scores{gap:10px}.sample{padding:16px}.bench-comparison{font-size:13px;color:var(--muted);margin:8px auto 12px}#voices button{font-size:14px;padding:8px 14px}@media(max-width:700px){.grid{grid-template-columns:1fr}.quote{font-size:18px}.scores label{font-size:14px}.choices button{padding:9px 3px;min-width:27px}.scores .choices{flex-basis:58%}}
.note-shortcuts{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.note-shortcuts button{font-size:11px;padding:5px 7px}.subjective-note{padding:12px 0;border-bottom:1px solid var(--line)}.subjective-note p{white-space:pre-wrap;font-size:14px;margin:8px 0}.subjective-note button{font-size:12px;padding:6px 10px}
/* Two gentle, compact rating rows. */
.scores{gap:12px;margin-top:14px}.scores label{font-size:14px;color:#b3bdc8;font-weight:400}.scores .choices{flex:0 1 230px;background:#25292f;border:1px solid #2b3037;border-radius:12px;padding:4px;gap:2px}.choices button{padding:7px 6px;font-size:13px;min-width:28px;color:#aab8c9;background:transparent;border-radius:8px}.choices button:hover{background:#303741}.choices button[aria-pressed=true]{background:#34483f;color:#d9e9df;box-shadow:inset 0 0 0 1px #547064}.sample{background:#1c1f24;border-color:#292d34}.sample>p{color:#89929f}.note-shortcuts button{background:transparent;color:#aab4c0;border-color:#303640}@media(max-width:520px){.scores label{font-size:13px}.scores .choices{flex-basis:205px}.choices button{min-width:25px;padding:8px 4px}}
</style>
<script>
(()=>{
document.getElementById('export').parentElement.classList.add('export-actions');
if(DATA.three_way){document.getElementById('control').hidden=true;document.body.classList.add('three-way')}
const compareHint=document.createElement('p');compareHint.className='bench-comparison';compareHint.textContent=DATA.cross_engine?'Qwen original / Qwen ajustado / Chatterbox · A/B/C aleatorio · 0–5':(DATA.three_way?'0 / 4.020 / 4.770 pasos · A/B/C':'4.020 / 4.770 pasos · A/B')+' en orden aleatorio · 0–5';document.getElementById('cards').before(compareHint);
if(DATA.cross_engine){const toggle=document.createElement('button');toggle.id='direct-compare';toggle.style.marginLeft='8px';toggle.onclick=()=>document.getElementById('reveal').click();compareHint.append(' ',toggle)}
const compactEnhance=minimalEnhance;
minimalEnhance=function(){compactEnhance();const toggle=document.getElementById('direct-compare');if(toggle)toggle.textContent=revealed?'Ocultar modelos':'Mostrar modelos';for(const box of document.querySelectorAll('.sample')){box.querySelector('h3').textContent=box.querySelector('h3').textContent.replace('Muestra ','');const note=box.querySelector('textarea');if(note&&!note.closest('details')){const details=document.createElement('details'),summary=document.createElement('summary');summary.textContent='Observación';details.append(summary);note.before(details);details.append(note);note.placeholder='Lo que percibes: la erre suena rara, inflexión poco natural, acento argentino…';note.setAttribute('aria-label','Observación subjetiva de esta muestra');note.oninput=()=>note.dispatchEvent(new Event('change'));
const shortcuts=document.createElement('div');shortcuts.className='note-shortcuts';
for(const text of ['Erre rara','Inflexión rara','Acento poco chileno','Pausa extraña','Marcar momento']){const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=()=>{const audio=box.querySelector('audio');const seconds=Math.floor(audio.currentTime||0);const stamp='['+Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')+'] ';note.value+=(note.value?'\n':'')+(text==='Marcar momento'?stamp:text+': ');note.dispatchEvent(new Event('input'));note.focus()};shortcuts.append(b)}details.append(shortcuts);if(note.value)details.open=true}}};render();
const header=document.createElement('header');header.className='bench-header';header.innerHTML='<div><strong>dicta</strong><small>BENCH</small></div><nav aria-label="Laboratorio de voces"></nav><button id="bench-pause">Pausar audio</button>';document.body.prepend(header);
const panel=document.createElement('section');panel.className='bench-panel';panel.hidden=true;header.after(panel);
const review=[...document.body.children].filter(e=>e!==header&&e!==panel&&!['SCRIPT','STYLE'].includes(e.tagName));let current='Evaluar';
function ready(v){return v?.heard&&metrics.every(([k])=>v[k]!==null&&v[k]!==undefined&&v[k]!==''&&Number(v[k])>=0&&Number(v[k])<=5)}
function count(v){return DATA.cards.filter(c=>c.voice===v).reduce((n,c)=>n+SIDES.filter(s=>ready(state[c.key+'_'+s])).length,0)}
function show(name){current=name;document.querySelectorAll('audio').forEach(a=>a.pause());review.forEach(e=>e.toggleAttribute('data-bench-hidden',name!=='Evaluar'));panel.hidden=name==='Evaluar';header.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.textContent===name?'page':'false'));panel.replaceChildren();if(name==='Evaluar')return;
 const title=document.createElement('h1');title.textContent=name==='Voces'?'Voces':name==='Resultados'?'Resultados':'Cómo comparar';panel.append(title);
 const intro=document.createElement('p');panel.append(intro);
 if(name==='Voces'){intro.textContent=Object.keys(DATA.targets).length+' voces · 5 frases por voz · perfiles por confirmar';const grid=document.createElement('div');grid.className='voice-grid';panel.append(grid);for(const v of Object.keys(DATA.targets)){const tile=document.createElement('article');tile.className='voice-tile';const h=document.createElement('h2');h.textContent=v;const p=document.createElement('p');p.textContent=DATA.targets[v];const progress=document.createElement('p');progress.textContent=count(v)+'/'+(5*SIDES.length);const b=document.createElement('button');b.textContent='Evaluar';b.setAttribute('aria-label','Evaluar '+v);b.onclick=()=>{voice=v;minimalIndex=0;render();show('Evaluar')};tile.append(h,p,progress,b);grid.append(tile)}}
 if(name==='Resultados'){intro.textContent=DATA.cross_engine?'Puedes mostrar los modelos sin completar la evaluación. Las medias requieren las puntuaciones completas.':'Completa la evaluación para revelar las versiones y sus medias.';const wrap=document.createElement('div');wrap.className='bench-table-wrap';const table=document.createElement('table');table.className='bench-table';table.innerHTML='<thead><tr><th>Voz</th><th>Completos</th><th>Estado</th></tr></thead>';const body=document.createElement('tbody');for(const v of Object.keys(DATA.targets)){const tr=document.createElement('tr');for(const text of [v,count(v)+'/'+(5*SIDES.length),count(v)===5*SIDES.length?'Lista para analizar':'Pendiente']){const td=document.createElement('td');td.textContent=text;tr.append(td)}body.append(tr)}table.append(body);wrap.append(table);panel.append(wrap);if(complete()&&revealed){for(const condition of DATA.conditions){const samples=DATA.cards.flatMap(c=>SIDES.filter(s=>c[s].condition===condition).map(s=>state[c.key+'_'+s]));const p=document.createElement('p');p.textContent=(DATA.labels[condition]||{base_control:'0 pasos de ajuste',parent:'4.020 pasos',candidate:'4.770 pasos'}[condition])+' · '+metrics.map(([k,label])=>label+': '+(samples.reduce((n,v)=>n+Number(v[k]),0)/samples.length).toFixed(2)+'/5').join(' · ');panel.append(p)}}if(DATA.three_way&&!DATA.cross_engine){const legacy=document.createElement('a');legacy.href='../ESCUCHAR_OCHO.html?v=two';legacy.textContent='Consultar evaluación A/B anterior';panel.append(legacy)}const exportButton=document.createElement('button');exportButton.textContent='Exportar evaluación JSON';exportButton.onclick=()=>document.getElementById('export').click();panel.append(exportButton);const revealButton=document.createElement('button');revealButton.textContent=DATA.cross_engine?(revealed?'Ocultar modelos':'Mostrar modelos'):'Revelar versiones';revealButton.disabled=!DATA.cross_engine&&!complete();revealButton.onclick=()=>{document.getElementById('reveal').click();show('Resultados')};panel.append(revealButton);
const notes=DATA.cards.flatMap(c=>SIDES.filter(side=>state[c.key+'_'+side]?.notes?.trim()).map(side=>({card:c,side,text:state[c.key+'_'+side].notes})));
const heading=document.createElement('h2');heading.textContent='Mis observaciones · '+notes.length;panel.append(heading);
if(!notes.length){const empty=document.createElement('p');empty.textContent='Tus impresiones aparecerán aquí al escribirlas en cada muestra.';panel.append(empty)}
for(const item of notes){const row=document.createElement('article');row.className='subjective-note';const title=document.createElement('strong');title.textContent=item.card.voice+' · '+item.card.phrase+' · Muestra '+item.side;const text=document.createElement('p');text.textContent=item.text;const back=document.createElement('button');back.textContent='Volver a escuchar';back.onclick=()=>{voice=item.card.voice;minimalIndex=DATA.cards.filter(c=>c.voice===voice).findIndex(c=>c.key===item.card.key);render();show('Evaluar')};row.append(title,text,back);panel.append(row)}
}
 if(name==='Método'&&DATA.cross_engine){intro.textContent='Un adaptador Qwen compartido para cuatro hablantes, con una pérdida experimental del codec principal. Veinte frases comparadas con Qwen original y Chatterbox ajustado.';for(const text of ['Entrenamiento: 425 grabaciones; validación: 56 reservadas, 16 usadas para elegir checkpoint; cuatro referencias separadas. Hablantes vistos: no demuestra generalización a voces nuevas.','Puedes mostrar u ocultar los modelos cuando quieras. El JSON registra la exposición; ocultarlos después no restaura una evaluación ciega. Las letras cambian por frase. Puntúa acento y naturalidad de 0 a 5 y anota errores de contenido. Generaciones Qwen por lotes de cuatro; tiempos por audio no medidos.','Los pasos y las pérdidas de motores distintos no son comparables directamente. Los originales se conservan y las copias tienen una ganancia común.','Investigación privada. Derechos comerciales y futuro entrenamiento de Whisper pendientes. Exporta el JSON para conservar tus evaluaciones.']){const p=document.createElement('p');p.textContent=text;panel.append(p)}}
 if(name==='Método'&&!DATA.cross_engine){intro.textContent='Un modelo con ocho referencias vocales. '+(DATA.three_way?'Comparamos 0, 4.020 y 4.770 pasos de ajuste; 0 corresponde al modelo ya preentrenado.':'Comparamos 4.020 y 4.770 pasos.')+' Cinco frases idénticas por voz, orden oculto.';for(const text of ['Escucha a velocidad normal. Puntúa de 0 a 5 (0 = mínimo; sin selección = pendiente) acento chileno y naturalidad para cada audio. Anota negaciones, números, palabras omitidas, repeticiones o cortes.','Cinco hablantes no participaron en el ajuste y tres sí. Edad, ritmo y rasgos fonéticos de los perfiles aún no están confirmados.','El ajuste se detuvo tras 750 pasos adicionales: la pérdida de validación no mejoró. Las puntuaciones humanas siguen pendientes; esta evaluación de un oyente es exploratoria.','Los originales se conservan. Las copias de escucha tienen una ganancia uniforme; esto no repara distorsión existente.','Los audios y los pesos permanecen privados. El permiso comercial del corpus está pendiente y todavía no se ha entrenado Whisper.','El borrador se guarda en este navegador cuando el almacenamiento está disponible. Exporta el JSON para conservar una copia.']){const p=document.createElement('p');p.textContent=text;panel.append(p)}}
}
for(const name of ['Voces','Evaluar','Resultados','Método']){const b=document.createElement('button');b.textContent=name;b.onclick=()=>show(name);header.querySelector('nav').append(b)}header.querySelector('#bench-pause').onclick=()=>document.querySelectorAll('audio').forEach(a=>a.pause());show('Evaluar');
})();
</script>

<style>body.three-way .grid{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:850px){body.three-way .grid{grid-template-columns:1fr}}</style>
