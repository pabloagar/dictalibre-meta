<style>
:root{--bg:#131416;--card:#181a1e;--line:#292d34;--muted:#9aa1ad;--green:#225c4f}body{background:var(--bg);color:#ededeb;font-family:'Public Sans',system-ui,sans-serif}button{border-radius:8px;background:#25292f;border:1px solid var(--line);color:inherit;padding:10px 16px;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #98d2c1;outline-offset:3px}button:disabled{opacity:.4;cursor:default}.bench-header{border-bottom:1px solid var(--line);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.bench-header strong{font-weight:500;font-size:22px}.bench-header small{color:var(--muted);letter-spacing:3px;margin-left:8px}.bench-header nav{display:flex;gap:8px;flex-wrap:wrap}.bench-header button[aria-current=page]{background:var(--green)}body>h1{font-size:25px;font-weight:500}.card{border-radius:16px;padding:32px;box-shadow:0 16px 50px #0002}.quote{font-family:Georgia,serif;font-size:27px;line-height:1.6}.sample{background:#20232880;padding:20px;border-radius:12px}.sample h3{font-size:13px;letter-spacing:1px;text-transform:uppercase;font-weight:500}.scores{gap:16px}.scores label{font-size:13px;color:var(--muted)}.choices{background:#25292f;border-radius:8px;padding:3px}.choices button{border:0}.choices button[aria-pressed=true]{background:#225c4f;color:#e9f3ef}textarea{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;min-height:52px}.bench-panel{max-width:960px;margin:40px auto;padding:0 24px}.bench-panel h1{font-weight:500}.bench-panel p{color:var(--muted);line-height:1.7}.voice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.voice-tile{background:var(--card);border:1px solid var(--line);padding:22px;border-radius:14px}.voice-tile h2{font-size:20px}.bench-table{border-collapse:collapse;width:100%;font-size:14px}.bench-table th,.bench-table td{text-align:left;padding:14px 8px;border-bottom:1px solid var(--line)}.bench-table-wrap{overflow:auto}.bench-tools{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.bench-panel[hidden],[data-bench-hidden]{display:none!important}@media(max-width:700px){.card{padding:18px}.quote{font-size:23px}.bench-header{padding:16px}.bench-header nav{width:100%}}
</style>
<script>
(()=>{
const header=document.createElement('header');header.className='bench-header';header.innerHTML='<div><strong>dicta</strong><small>BENCH</small></div><nav aria-label="Laboratorio de voces"></nav><button id="bench-pause">Pausar audio</button>';document.body.prepend(header);
const panel=document.createElement('section');panel.className='bench-panel';panel.hidden=true;header.after(panel);
const review=[...document.body.children].filter(e=>e!==header&&e!==panel&&!['SCRIPT','STYLE'].includes(e.tagName));let current='Evaluar';
function ready(v){return v?.heard&&metrics.every(([k])=>Number(v[k])>=1&&Number(v[k])<=5)}
function count(v){return DATA.cards.filter(c=>c.voice===v).reduce((n,c)=>n+['A','B'].filter(s=>ready(state[c.key+'_'+s])).length,0)}
function show(name){current=name;document.querySelectorAll('audio').forEach(a=>a.pause());review.forEach(e=>e.toggleAttribute('data-bench-hidden',name!=='Evaluar'));panel.hidden=name==='Evaluar';header.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.textContent===name?'page':'false'));panel.replaceChildren();if(name==='Evaluar')return;
 const title=document.createElement('h1');title.textContent=name==='Voces'?'Ocho voces por descubrir':name==='Resultados'?'Tu evaluación':'Cómo comparar';panel.append(title);
 const intro=document.createElement('p');panel.append(intro);
 if(name==='Voces'){intro.textContent='Cuatro referencias femeninas y cuatro masculinas. Escucha cada referencia y comprueba el perfil antes de valorar sus cinco frases.';const grid=document.createElement('div');grid.className='voice-grid';panel.append(grid);for(const v of Object.keys(DATA.targets)){const tile=document.createElement('article');tile.className='voice-tile';const h=document.createElement('h2');h.textContent=v;const p=document.createElement('p');p.textContent=DATA.targets[v]+' · perfil por confirmar';const progress=document.createElement('p');progress.textContent=count(v)+'/10 audios evaluados';const b=document.createElement('button');b.textContent='Evaluar '+v;b.onclick=()=>{voice=v;minimalIndex=0;render();show('Evaluar')};tile.append(h,p,progress,b);grid.append(tile)}}
 if(name==='Resultados'){intro.textContent='Progreso por voz. Las medias de las versiones se muestran después de completar y revelar A/B. Una valoración parcial no equivale a una aprobación.';const wrap=document.createElement('div');wrap.className='bench-table-wrap';const table=document.createElement('table');table.className='bench-table';table.innerHTML='<thead><tr><th>Voz</th><th>Completos</th><th>Estado</th></tr></thead>';const body=document.createElement('tbody');for(const v of Object.keys(DATA.targets)){const tr=document.createElement('tr');for(const text of [v,count(v)+'/10',count(v)===10?'Lista para analizar':'Pendiente']){const td=document.createElement('td');td.textContent=text;tr.append(td)}body.append(tr)}table.append(body);wrap.append(table);panel.append(wrap);if(complete()&&revealed){for(const condition of ['parent','candidate']){const samples=DATA.cards.flatMap(c=>['A','B'].filter(s=>c[s].condition===condition).map(s=>state[c.key+'_'+s]));const p=document.createElement('p');p.textContent=(condition==='parent'?'4.020 pasos':'4.770 pasos')+' · '+metrics.map(([k,label])=>label+': '+(samples.reduce((n,v)=>n+Number(v[k]),0)/samples.length).toFixed(2)+'/5').join(' · ');panel.append(p)}}const exportButton=document.createElement('button');exportButton.textContent='Exportar evaluación JSON';exportButton.onclick=()=>document.getElementById('export').click();panel.append(exportButton);const revealButton=document.createElement('button');revealButton.textContent='Revelar versiones';revealButton.disabled=!complete();revealButton.onclick=()=>{document.getElementById('reveal').click();show('Resultados')};panel.append(revealButton)}
 if(name==='Método'){intro.textContent='Un modelo con ocho referencias vocales. Comparamos 4.020 y 4.770 pasos, con cinco frases idénticas por voz y orden A/B oculto.';for(const text of ['Escucha a velocidad normal. Puntúa de 1 a 5 acento chileno, naturalidad, inteligibilidad y fidelidad para cada audio. Anota negaciones, números, palabras omitidas, repeticiones o cortes.','Cinco hablantes no participaron en el ajuste y tres sí. Edad, ritmo y rasgos fonéticos de los perfiles aún no están confirmados.','El ajuste se detuvo tras 750 pasos adicionales: la pérdida de validación no mejoró. Las puntuaciones humanas siguen pendientes; esta evaluación de un oyente es exploratoria.','Los originales se conservan. Las copias de escucha tienen una ganancia uniforme; esto no repara distorsión existente.','Los audios y los pesos permanecen privados. El permiso comercial del corpus está pendiente y todavía no se ha entrenado Whisper.','El borrador se guarda en este navegador cuando el almacenamiento está disponible. Exporta el JSON para conservar una copia.']){const p=document.createElement('p');p.textContent=text;panel.append(p)}}
}
for(const name of ['Voces','Evaluar','Resultados','Método']){const b=document.createElement('button');b.textContent=name;b.onclick=()=>show(name);header.querySelector('nav').append(b)}header.querySelector('#bench-pause').onclick=()=>document.querySelectorAll('audio').forEach(a=>a.pause());show('Evaluar');
})();
</script>
